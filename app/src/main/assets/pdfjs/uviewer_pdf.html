<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0, user-scalable=yes">
    <style>
        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background: #202124;
            color: #111;
            overscroll-behavior: none;
        }
        #viewer {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 0 16px;
        }
        .page {
            position: relative;
            margin: 0 auto 8px;
            background: #fff;
            box-shadow: 0 1px 3px rgba(0,0,0,.32);
            overflow: hidden;
        }
        .page canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .highlight-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .page .detail-canvas, .page .detail-pending {
            position: absolute;
            pointer-events: none;
        }
        .detail-canvas img, .detail-pending img {
            position: absolute;
            display: block;
        }
        .detail-tile {
            position: absolute;
            overflow: hidden;
        }
        .pdf-search-highlight {
            position: absolute;
            background: rgba(255, 221, 87, .56);
            border-radius: 2px;
            mix-blend-mode: multiply;
        }
        .pdf-search-current {
            background: rgba(255, 145, 77, .78);
            outline: 2px solid rgba(255, 115, 0, .55);
        }
        .loading {
            color: #fff;
            font: 14px sans-serif;
            text-align: center;
            padding: 36px 16px;
        }
    </style>
</head>
<body>
    <div id="viewer"><div class="loading">Loading...</div></div>
    <script src="pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

        const viewer = document.getElementById('viewer');
        let pdfDoc = null;
        let pages = [];
        let pageTexts = new Map();
        let matches = [];
        let currentMatchIndex = -1;
        let currentPage = 1;
        let renderObserver = null;
        let reportTimer = null;
        let searchSerial = 0;
        let detailRenderPromise = null;
        let detailTimer = null;
        let detailTimerResolve = null;
        const DETAIL_DEBOUNCE_MS = 120;
        let detailSerial = 0;
        let detailTask = null;
        let detailRequestKey = null;
        let nativePageScale = null;
        let detailRenderingSerial = null;
        let detailSettleTimers = [];

        function detailZoom() {
            // Android can report pinch scaling before visualViewport is updated
            // (and sometimes without a resize event until the next scroll).
            return nativePageScale !== null ? nativePageScale / (window.devicePixelRatio || 1) :
                (window.visualViewport ? window.visualViewport.scale : 1);
        }

        function onNativeScaleChanged(scale) {
            if (!Number.isFinite(scale) || scale <= 0) return;
            nativePageScale = scale;
            return scheduleDetailRender();
        }

        // Cache whole pages at the zoom resolution. Panning within the same
        // pages must neither restart an in-flight render nor replace its bitmap.
        function scheduleDetailRender() {
            const visual = window.visualViewport;
            const viewLeft = visual ? visual.pageLeft : window.scrollX;
            const viewTop = visual ? visual.pageTop : window.scrollY;
            const viewWidth = visual ? visual.width : window.innerWidth;
            const viewHeight = visual ? visual.height : window.innerHeight;
            const visiblePages = pages.filter(pageInfo => {
                const bounds = pageInfo.el.getBoundingClientRect();
                const left = bounds.left + window.scrollX;
                const top = bounds.top + window.scrollY;
                return left < viewLeft + viewWidth && left + bounds.width > viewLeft &&
                    top < viewTop + viewHeight && top + bounds.height > viewTop;
            });
            const key = [detailZoom(), window.devicePixelRatio || 1,
                ...visiblePages.map(pageInfo => pageInfo.num)].join(':');
            if (key === detailRequestKey) return detailRenderPromise;
            detailRequestKey = key;
            ++detailSerial;
            if (detailTask) detailTask.cancel();
            cancelDetailDelay();
            detailRenderPromise = new Promise(resolve => {
                detailTimerResolve = resolve;
                detailTimer = setTimeout(flushDetailRender, DETAIL_DEBOUNCE_MS);
            });
            return detailRenderPromise;
        }

        function cancelDetailDelay() {
            clearTimeout(detailTimer);
            detailTimer = null;
            if (detailTimerResolve) detailTimerResolve();
            detailTimerResolve = null;
        }

        function flushDetailRender() {
            if (detailTimer === null) return detailRenderPromise;
            clearTimeout(detailTimer);
            detailTimer = null;
            const resolve = detailTimerResolve;
            detailTimerResolve = null;
            const serial = detailSerial;
            detailRenderingSerial = serial;
            resolve(renderVisibleDetails(serial).finally(() => {
                if (detailRenderingSerial === serial) detailRenderingSerial = null;
            }));
            return detailRenderPromise;
        }

        function clearDetailSettlement() {
            detailSettleTimers.forEach(clearTimeout);
            detailSettleTimers = [];
        }

        function settleDetailGesture() {
            clearDetailSettlement();
            let lastVisualScale = window.visualViewport ? window.visualViewport.scale : 1;
            const refresh = () => {
                const visual = window.visualViewport;
                // A viewport update arriving after touchend is newer than the
                // native scale snapshot that may have started the pending job.
                if (visual && visual.scale !== lastVisualScale) {
                    lastVisualScale = visual.scale;
                    if (nativePageScale !== null) nativePageScale = visual.scale * (window.devicePixelRatio || 1);
                }
                // Recheck an idle request even when its key has not changed.
                // Cached pages are reused; active work must not be restarted.
                if (detailTimer === null && detailRenderingSerial === null) detailRequestKey = null;
                scheduleDetailRender();
                return flushDetailRender();
            };
            // WebView may finish updating the viewport after the last DOM touch
            // event, without emitting another resize/scroll. Use bounded checks.
            detailSettleTimers = [60, 180, 360].map(delay => setTimeout(refresh, delay));
            return refresh();
        }

        function finishDetailGesture(event) {
            if (event.touches.length > 0) return;
            return settleDetailGesture();
        }

        async function renderVisibleDetails(serial) {
            const visual = window.visualViewport;
            const zoom = detailZoom();
            const viewLeft = visual ? visual.pageLeft : window.scrollX;
            const viewTop = visual ? visual.pageTop : window.scrollY;
            const viewWidth = visual ? visual.width : window.innerWidth;
            const viewHeight = visual ? visual.height : window.innerHeight;
            for (const pageInfo of pages) {
                if (serial !== detailSerial) return;
                const bounds = pageInfo.el.getBoundingClientRect();
                const pageLeft = bounds.left + window.scrollX;
                const pageTop = bounds.top + window.scrollY;
                const left = Math.max(0, viewLeft - pageLeft);
                const top = Math.max(0, viewTop - pageTop);
                const right = Math.min(bounds.width, viewLeft + viewWidth - pageLeft);
                const bottom = Math.min(bounds.height, viewTop + viewHeight - pageTop);
                if (zoom <= 1 || right <= left || bottom <= top) {
                    removeDetailCanvas(pageInfo);
                    continue;
                }
                const width = bounds.width;
                const height = bounds.height;
                const outputScale = Math.max(1, window.devicePixelRatio || 1) * zoom;
                const key = [width, height, outputScale].join(':');
                if (pageInfo.detailKey === key) continue;
                let canvas = null;
                let task = null;
                try {
                    const page = await pdfDoc.getPage(pageInfo.num);
                    if (serial !== detailSerial) return;
                    const viewport = page.getViewport({ scale: pageInfo.scale });
                    const pixelWidth = Math.ceil(width * outputScale);
                    const pixelHeight = Math.ceil(height * outputScale);
                    if (pixelWidth * pixelHeight > 16777216 || pixelWidth > 8192 || pixelHeight > 8192) {
                        canvas = await renderDetailTiles(pageInfo, page, viewport, width, height, outputScale, serial);
                        if (!canvas || serial !== detailSerial) return;
                    } else {
                        canvas = document.createElement('canvas');
                        canvas.className = 'detail-canvas';
                        canvas.width = pixelWidth;
                        canvas.height = pixelHeight;
                        canvas.style.left = '0px';
                        canvas.style.top = '0px';
                        canvas.style.width = width + 'px';
                        canvas.style.height = height + 'px';
                        task = page.render({
                            canvasContext: canvas.getContext('2d'),
                            viewport,
                            transform: [canvas.width / viewport.width, 0, 0,
                                canvas.height / viewport.height, 0, 0]
                        });
                        detailTask = task;
                        await task.promise;
                        if (serial !== detailSerial) return;
                    }
                    // Keep the previous image until its replacement is complete.
                    removeDetailCanvas(pageInfo);
                    canvas.className = 'detail-canvas';
                    pageInfo.el.insertBefore(canvas, pageInfo.el.querySelector('.highlight-layer'));
                    pageInfo.detailKey = key;
                    canvas = null;
                } catch (error) {
                    if (serial === detailSerial) detailRequestKey = null;
                    if (error.name !== 'RenderingCancelledException') {
                        console.error(error);
                    }
                } finally {
                    if (detailTask === task) detailTask = null;
                    if (canvas) releaseDetail(canvas);
                }
            }
        }

        // Large zoom levels cannot fit in one canvas. Keep lossless compressed
        // tiles for the whole page and reuse one small raster buffer while drawing.
        async function renderDetailTiles(pageInfo, page, viewport, width, height, scale, serial) {
            const layer = document.createElement('div');
            layer.className = 'detail-pending';
            layer.style.left = '0px';
            layer.style.top = '0px';
            layer.tileUrls = [];
            const buffer = document.createElement('canvas');
            const pixelWidth = Math.ceil(width * scale);
            const pixelHeight = Math.ceil(height * scale);
            // All tiles share one pixel grid and one CSS transform. Independently
            // rounded fractional tile positions can drift at WebView zoom levels.
            layer.style.width = pixelWidth + 'px';
            layer.style.height = pixelHeight + 'px';
            layer.style.transformOrigin = '0 0';
            layer.style.transform = `scale(${width / pixelWidth}, ${height / pixelHeight})`;
            const scaleX = pixelWidth / viewport.width;
            const scaleY = pixelHeight / viewport.height;
            const tileSize = 2044;
            const padding = 2;
            const pending = [];
            for (let y = 0; y < pixelHeight; y += tileSize) {
                for (let x = 0; x < pixelWidth; x += tileSize) pending.push({ x, y });
            }
            let complete = false;
            let attached = false;
            try {
                while (pending.length > 0) {
                    // Re-evaluate on every tile so panning prioritizes newly
                    // visible content without cancelling or redrawing cached tiles.
                    const visual = window.visualViewport;
                    const bounds = pageInfo.el.getBoundingClientRect();
                    const left = ((visual ? visual.pageLeft : window.scrollX) -
                        bounds.left - window.scrollX) * pixelWidth / bounds.width;
                    const top = ((visual ? visual.pageTop : window.scrollY) -
                        bounds.top - window.scrollY) * pixelHeight / bounds.height;
                    const right = left + (visual ? visual.width : window.innerWidth) * pixelWidth / bounds.width;
                    const bottom = top + (visual ? visual.height : window.innerHeight) * pixelHeight / bounds.height;
                    const centerColumn = Math.max(0, Math.min(Math.ceil(pixelWidth / tileSize) - 1,
                        Math.floor((left + right) / 2 / tileSize)));
                    const centerRow = Math.max(0, Math.min(Math.ceil(pixelHeight / tileSize) - 1,
                        Math.floor((top + bottom) / 2 / tileSize)));
                    const priority = tile => {
                        const tileRight = Math.min(pixelWidth, tile.x + tileSize);
                        const tileBottom = Math.min(pixelHeight, tile.y + tileSize);
                        const visible = tile.x < right && tileRight > left &&
                            tile.y < bottom && tileBottom > top;
                        const dx = tile.x / tileSize - centerColumn;
                        const dy = tile.y / tileSize - centerRow;
                        const ring = Math.max(Math.abs(dx), Math.abs(dy));
                        const angle = (Math.atan2(dy, dx) + 2 * Math.PI) % (2 * Math.PI);
                        return { offscreen: visible ? 0 : 1, ring, angle };
                    };
                    // Finish all visible tiles first. Within each group, walk
                    // clockwise around a complete ring before stepping outward.
                    const ranked = pending.map(tile => ({ tile, ...priority(tile) }));
                    ranked.sort((a, b) => a.offscreen - b.offscreen || a.ring - b.ring || a.angle - b.angle);
                    pending.splice(0, pending.length, ...ranked.map(entry => entry.tile));
                    const { x, y } = pending.shift();
                    if (serial !== detailSerial) return null;
                    const tileWidth = Math.min(tileSize, pixelWidth - x);
                    const tileHeight = Math.min(tileSize, pixelHeight - y);
                    const renderLeft = Math.max(0, x - padding);
                    const renderTop = Math.max(0, y - padding);
                    // Render a gutter on every side, but display only the tile's
                    // own rectangle. Completion order cannot overwrite neighbours.
                    buffer.width = Math.min(pixelWidth, x + tileWidth + padding) - renderLeft;
                    buffer.height = Math.min(pixelHeight, y + tileHeight + padding) - renderTop;
                    const task = page.render({
                        canvasContext: buffer.getContext('2d'), viewport,
                        transform: [scaleX, 0, 0, scaleY, -renderLeft, -renderTop]
                    });
                    detailTask = task;
                    try {
                        await task.promise;
                    } finally {
                        if (detailTask === task) detailTask = null;
                    }
                    if (serial !== detailSerial) return null;
                    const blob = await new Promise((resolve, reject) => {
                        buffer.toBlob(value => value ? resolve(value) :
                            reject(new Error('Unable to encode PDF detail tile')), 'image/png');
                    });
                    if (serial !== detailSerial) return null;
                    const url = URL.createObjectURL(blob);
                    layer.tileUrls.push(url);
                    const tile = document.createElement('img');
                    tile.src = url;
                    tile.alt = '';
                    tile.decoding = 'async';
                    tile.style.left = (renderLeft - x) + 'px';
                    tile.style.top = (renderTop - y) + 'px';
                    tile.style.width = buffer.width + 'px';
                    tile.style.height = buffer.height + 'px';
                    await tile.decode();
                    if (serial !== detailSerial) return null;
                    const region = document.createElement('div');
                    region.className = 'detail-tile';
                    region.style.left = x + 'px';
                    region.style.top = y + 'px';
                    region.style.width = tileWidth + 'px';
                    region.style.height = tileHeight + 'px';
                    region.appendChild(tile);
                    layer.appendChild(region);
                    // Publish each ready tile immediately over the previous image.
                    // The rest of the page continues rendering in the background.
                    if (!attached) {
                        pageInfo.el.insertBefore(layer, pageInfo.el.querySelector('.highlight-layer'));
                        attached = true;
                    }
                }
                complete = true;
                return layer;
            } finally {
                buffer.width = 0;
                buffer.height = 0;
                if (!complete) releaseDetail(layer);
            }
        }

        function releaseDetail(element) {
            element.remove();
            if (element.tileUrls) {
                element.querySelectorAll('img').forEach(tile => tile.removeAttribute('src'));
                element.tileUrls.forEach(url => URL.revokeObjectURL(url));
                element.tileUrls = [];
            } else {
                element.width = 0;
                element.height = 0;
            }
        }

        function removeDetailCanvas(pageInfo) {
            const canvas = pageInfo.el.querySelector('.detail-canvas');
            if (canvas) releaseDetail(canvas);
            pageInfo.detailKey = null;
        }

        function reportPage(pageNumber) {
            currentPage = Math.max(1, Math.min(pageNumber, pages.length || pageNumber));
            if (window.Android && Android.onPageChanged) {
                Android.onPageChanged(currentPage - 1, pages.length);
            }
        }

        function scheduleReportPage() {
            if (reportTimer) clearTimeout(reportTimer);
            reportTimer = setTimeout(() => {
                const marker = window.scrollY + Math.max(1, window.innerHeight * 0.25);
                let found = currentPage;
                for (const pageInfo of pages) {
                    const top = pageInfo.el.offsetTop;
                    const bottom = top + pageInfo.el.offsetHeight;
                    if (marker >= top && marker <= bottom) {
                        found = pageInfo.num;
                        break;
                    }
                    if (top <= marker) found = pageInfo.num;
                }
                reportPage(found);
            }, 120);
        }

        function normalizeText(text) {
            return (text || '')
                .normalize('NFKC')
                .toLocaleLowerCase()
                .replace(/[\s\u0000-\u001f\u007f-\u009f\u200b-\u200f\ufeff]/g, '');
        }

        function makeCharRefs(text, rect, itemIndex) {
            const chars = Array.from(text || '');
            const refs = [];
            if (chars.length === 0) return refs;

            const charWidth = rect.width / chars.length;
            chars.forEach((char, charIndex) => {
                const normalized = normalizeText(char);
                if (!normalized) return;

                const normalizedChars = Array.from(normalized);
                const normalizedCharWidth = charWidth / normalizedChars.length;
                normalizedChars.forEach((normalizedChar, normalizedIndex) => {
                    refs.push({
                        text: normalizedChar,
                        itemIndex,
                        rect: {
                            left: rect.left + (charIndex * charWidth) + (normalizedIndex * normalizedCharWidth),
                            top: rect.top,
                            width: normalizedCharWidth,
                            height: rect.height
                        }
                    });
                });
            });
            return refs;
        }

        function mergeCharRects(charRefs) {
            const merged = [];
            charRefs.forEach(ref => {
                const rect = ref.rect;
                const last = merged[merged.length - 1];
                if (last) {
                    const sameLine = Math.abs(last.top - rect.top) < 2 && Math.abs(last.height - rect.height) < 2;
                    const gap = rect.left - (last.left + last.width);
                    if (sameLine && gap <= Math.max(2, rect.width * 0.75)) {
                        const right = Math.max(last.left + last.width, rect.left + rect.width);
                        const bottom = Math.max(last.top + last.height, rect.top + rect.height);
                        last.left = Math.min(last.left, rect.left);
                        last.top = Math.min(last.top, rect.top);
                        last.width = right - last.left;
                        last.height = bottom - last.top;
                        return;
                    }
                }
                merged.push({ left: rect.left, top: rect.top, width: rect.width, height: rect.height });
            });
            return merged;
        }

        function rectKey(rect) {
            return [rect.left, rect.top, rect.width, rect.height].map(v => Math.round(v * 10) / 10).join(':');
        }

        async function ensureText(pageInfo) {
            if (pageTexts.has(pageInfo.num)) return pageTexts.get(pageInfo.num);

            const page = await pdfDoc.getPage(pageInfo.num);
            const viewport = page.getViewport({ scale: pageInfo.scale });
            const textContent = await page.getTextContent();
            const textItems = [];
            let stream = '';
            const charMap = [];

            textContent.items.forEach((item, itemIndex) => {
                const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
                const fontHeight = Math.hypot(tx[2], tx[3]) || Math.max(8, (item.height || 8) * pageInfo.scale);
                const width = Math.max(1, (item.width || 1) * pageInfo.scale);
                const rect = {
                    left: tx[4],
                    top: tx[5] - fontHeight,
                    width: width,
                    height: fontHeight * 1.15
                };
                textItems.push({ text: item.str || '', rect: rect });

                makeCharRefs(item.str || '', rect, itemIndex).forEach(ref => {
                    stream += ref.text;
                    charMap.push(ref);
                });
            });

            const pageText = { stream, charMap, textItems };
            pageTexts.set(pageInfo.num, pageText);
            return pageText;
        }

        function clearHighlights() {
            document.querySelectorAll('.highlight-layer').forEach(layer => {
                layer.innerHTML = '';
            });
        }

        function drawMatch(match, isCurrent) {
            const pageInfo = pages[match.page - 1];
            if (!pageInfo) return;
            const layer = pageInfo.el.querySelector('.highlight-layer');
            match.rects.forEach(rect => {
                const div = document.createElement('div');
                div.className = 'pdf-search-highlight' + (isCurrent ? ' pdf-search-current' : '');
                div.style.left = rect.left + 'px';
                div.style.top = rect.top + 'px';
                div.style.width = rect.width + 'px';
                div.style.height = rect.height + 'px';
                layer.appendChild(div);
            });
        }

        function renderHighlights() {
            clearHighlights();
            matches.forEach((match, index) => drawMatch(match, index === currentMatchIndex));
        }

        function scrollToCurrentMatch() {
            const match = matches[currentMatchIndex];
            if (!match) return;
            const pageInfo = pages[match.page - 1];
            if (!pageInfo) return;
            const rect = match.rects[0] || { top: 0 };
            window.scrollTo({
                top: pageInfo.el.offsetTop + rect.top - window.innerHeight * 0.3,
                behavior: 'auto'
            });
            reportPage(match.page);
        }

        async function find(query) {
            const serial = ++searchSerial;
            const needle = normalizeText(query);
            matches = [];
            currentMatchIndex = -1;
            clearHighlights();
            if (!needle) return reportSearchResult();

            for (const pageInfo of pages) {
                if (serial !== searchSerial) return reportSearchResult();
                const pageText = await ensureText(pageInfo);
                let fromIndex = 0;
                while (fromIndex <= pageText.stream.length) {
                    const index = pageText.stream.indexOf(needle, fromIndex);
                    if (index < 0) break;
                    const rects = mergeCharRects(pageText.charMap.slice(index, index + needle.length));
                    const deduped = [];
                    const seen = new Set();
                    rects.forEach(rect => {
                        const key = rectKey(rect);
                        if (!seen.has(key)) {
                            seen.add(key);
                            deduped.push(rect);
                        }
                    });
                    if (deduped.length > 0) {
                        matches.push({ page: pageInfo.num, rects: deduped });
                    }
                    fromIndex = index + Math.max(1, needle.length);
                }
            }

            currentMatchIndex = matches.length > 0 ? 0 : -1;
            renderHighlights();
            scrollToCurrentMatch();
            return reportSearchResult();
        }

        function result() {
            const match = matches[currentMatchIndex];
            return {
                current: currentMatchIndex >= 0 ? currentMatchIndex + 1 : 0,
                total: matches.length,
                page: match ? match.page - 1 : currentPage - 1
            };
        }

        function reportSearchResult() {
            const r = result();
            if (window.Android && Android.onSearchResult) {
                Android.onSearchResult(r.current, r.total, r.page);
            }
            return r;
        }

        function nextMatch() {
            if (matches.length === 0) return reportSearchResult();
            currentMatchIndex = (currentMatchIndex + 1) % matches.length;
            renderHighlights();
            scrollToCurrentMatch();
            return reportSearchResult();
        }

        function previousMatch() {
            if (matches.length === 0) return reportSearchResult();
            currentMatchIndex = (currentMatchIndex - 1 + matches.length) % matches.length;
            renderHighlights();
            scrollToCurrentMatch();
            return reportSearchResult();
        }

        function scrollToPage(pageNumber) {
            const pageInfo = pages[Math.max(0, Math.min(pageNumber - 1, pages.length - 1))];
            if (!pageInfo) return;
            window.scrollTo({ top: pageInfo.el.offsetTop, behavior: 'auto' });
            reportPage(pageInfo.num);
        }

        async function renderPage(pageInfo) {
            if (pageInfo.rendered || pageInfo.rendering) return;
            pageInfo.rendering = true;
            const page = await pdfDoc.getPage(pageInfo.num);
            const viewport = page.getViewport({ scale: pageInfo.scale });
            const canvas = pageInfo.el.querySelector('canvas');
            const context = canvas.getContext('2d');
            const outputScale = Math.max(1, window.devicePixelRatio || 1);
            canvas.width = Math.floor(viewport.width * outputScale);
            canvas.height = Math.floor(viewport.height * outputScale);
            canvas.style.width = viewport.width + 'px';
            canvas.style.height = viewport.height + 'px';
            const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
            await page.render({ canvasContext: context, viewport, transform }).promise;
            pageInfo.rendered = true;
            pageInfo.rendering = false;
        }

        async function loadPdf(fileUrl, initialPage) {
            ++detailSerial;
            cancelDetailDelay();
            clearDetailSettlement();
            detailRequestKey = null;
            if (detailTask) detailTask.cancel();
            pages.forEach(removeDetailCanvas);
            viewer.innerHTML = '<div class="loading">Loading...</div>';
            pdfDoc = await pdfjsLib.getDocument(fileUrl).promise;
            pages = [];
            pageTexts.clear();
            matches = [];
            currentMatchIndex = -1;
            viewer.innerHTML = '';

            const containerWidth = Math.max(240, viewer.clientWidth - 16);
            for (let num = 1; num <= pdfDoc.numPages; num++) {
                const page = await pdfDoc.getPage(num);
                const baseViewport = page.getViewport({ scale: 1 });
                const scale = containerWidth / baseViewport.width;
                const viewport = page.getViewport({ scale });
                const pageEl = document.createElement('div');
                pageEl.className = 'page';
                pageEl.dataset.page = String(num);
                pageEl.style.width = viewport.width + 'px';
                pageEl.style.height = viewport.height + 'px';
                pageEl.innerHTML = '<canvas></canvas><div class="highlight-layer"></div>';
                viewer.appendChild(pageEl);
                pages.push({ num, el: pageEl, scale, rendered: false, rendering: false });
            }

            if (renderObserver) renderObserver.disconnect();
            renderObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageNumber = Number(entry.target.dataset.page);
                        const pageInfo = pages[pageNumber - 1];
                        if (pageInfo) renderPage(pageInfo);
                    }
                });
            }, { root: null, rootMargin: '900px 0px' });
            pages.forEach(pageInfo => renderObserver.observe(pageInfo.el));
            scheduleDetailRender();

            if (window.Android && Android.onPdfLoaded) {
                Android.onPdfLoaded(pdfDoc.numPages);
            }
            setTimeout(() => scrollToPage((initialPage || 0) + 1), 100);
        }

        window.UviewerPdf = {
            loadPdf,
            onNativeScaleChanged,
            onNativeGestureStart: clearDetailSettlement,
            onNativeGestureEnd: settleDetailGesture,
            find,
            nextMatch,
            previousMatch,
            scrollToPage,
            nextPage: () => scrollToPage(currentPage + 1),
            previousPage: () => scrollToPage(currentPage - 1),
            clearSearch: () => {
                searchSerial++;
                matches = [];
                currentMatchIndex = -1;
                clearHighlights();
                return reportSearchResult();
            }
        };

        window.addEventListener('scroll', scheduleReportPage, { passive: true });
        window.addEventListener('scroll', scheduleDetailRender, { passive: true });
        window.addEventListener('resize', scheduleDetailRender, { passive: true });
        document.addEventListener('touchend', finishDetailGesture, { passive: true });
        document.addEventListener('touchstart', clearDetailSettlement, { passive: true });
        document.addEventListener('touchcancel', finishDetailGesture, { passive: true });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', scheduleDetailRender, { passive: true });
            window.visualViewport.addEventListener('scroll', scheduleDetailRender, { passive: true });
        }
        document.addEventListener('click', event => {
            if (matches.length > 0 && event.target.classList.contains('pdf-search-highlight')) return;
            // clientX is relative to the layout viewport. Pinch zoom and pan
            // move the visible screen within it, so classify taps in that screen.
            const visual = window.visualViewport;
            const screenX = event.clientX - (visual ? visual.offsetLeft : 0);
            const third = (visual ? visual.width : window.innerWidth) / 3;
            if (screenX < third) window.UviewerPdf.previousPage();
            else if (screenX > third * 2) window.UviewerPdf.nextPage();
            else if (window.Android && Android.toggleControls) Android.toggleControls();
        });
    </script>
</body>
</html>
